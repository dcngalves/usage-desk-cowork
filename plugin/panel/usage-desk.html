<title>Usage Desk Cowork 0.9.4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column, sized for a side panel. The palette is the Usage Desk window's own. */
:root { --text: #1f1f1f; --dim: #6b6b68; --mute: #9a9a96; --track: #ecebe8; --line: #e4e4e1; --fill: #f4f3f0; --bg: #faf9f5; --accent: #d97757; --on-accent: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --text: #ececec; --dim: #a8a8a4; --mute: #7d7d79; --track: #2c2c2b; --line: #333331; --fill: #262625; --bg: #1f1e1d; --accent: #d97757; --on-accent: #ffffff; color-scheme: dark } }
:root[data-theme="dark"] { --text: #ececec; --dim: #a8a8a4; --mute: #7d7d79; --track: #2c2c2b; --line: #333331; --fill: #262625; --bg: #1f1e1d; --accent: #d97757; --on-accent: #ffffff; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 640px; margin: 0 auto; }
svg { display: block; max-width: 100%; }
#head { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; margin-bottom: 10px; gap: 12px; }
.hero { display: flex; gap: 8px; align-items: center; }
.hero .right { flex: 1; min-width: 0; }
.press { cursor: pointer; border-radius: 4px; }
.press:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.press:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.section { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.dim { color: var(--dim); }
p { margin: 0; }
p:empty { display: none; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .value { flex: none; color: var(--dim); font-variant-numeric: tabular-nums; }
.row .note { color: var(--dim); margin-left: 6px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

button.plain:hover { color: var(--text); }

.inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; }
</style>
<main>
<div id="head"><span id="version">Usage Desk Cowork</span><span id="live">Connecting</span></div>
<div id="root"></div>
</main>
<script>
// This page reads from the Usage Desk extension on this computer, through the Claude app.
(function () {
  const SERVER = 'host:Usage_Desk'
  const PREFS = 'usage-desk-prefs'
  let mcp = null
  const ready = (async () => { mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null })()
  // What each refusal means for the person, and what fixes it.
  const WORDS = {
    no_app: 'Usage Desk reads from your computer, so it only works inside the Claude desktop app. Open this page there.',
    server_not_connected: 'The Usage Desk extension is not answering. Check that it is installed and turned on in the Claude desktop app, and that this page is open in that app.',
    not_in_manifest: "This page is not allowed to use the Usage Desk extension. Allow it in the page's Permissions menu.",
    approval_required: 'The app wants your approval before this page reads the extension. Allow it when asked.',
    not_granted: 'This view was not given access to the Usage Desk extension.',
    capability_disabled: 'This view cannot reach programs on your computer. Open the page in the Claude desktop app.',
    capability_removed: 'This view cannot reach programs on your computer. Open the page in the Claude desktop app.',
    blocked_by_policy: 'Your organization blocks this page from using the Usage Desk extension.',
    cancelled: 'The app did not allow that, so nothing was sent to the task.',
    bad_answer: 'The extension answered without figures. Update the Usage Desk extension.',
    tool_error: 'The extension could not do that. Update the Usage Desk extension.',
  }
  const DENIED = ['no_app', 'server_not_connected', 'not_in_manifest', 'approval_required', 'not_granted', 'capability_disabled', 'capability_removed', 'blocked_by_policy']
  // The agent's name and outfit are this viewer's own taste, so they stay in this browser.
  const localPrefs = () => {
    try { return JSON.parse(localStorage.getItem(PREFS) || '{}') || {} } catch { return {} }
  }
  window.usageDeskTransport = {
    everyMs: 5000,
    lostWords: 'Not connected to your computer',
    read: async () => {
      await ready
      if (!mcp) throw { code: 'no_app' }
      // Opened beside a task, the link ends in that task's id, and the panel follows that task alone.
      const own = /^#([0-9a-f][0-9a-f-]{7,63})$/i.exec(location.hash || '')
      const result = await mcp.callTool(SERVER, 'read_usage', own ? { task: own[1] } : {}, { cache: false })
      const figures = result && result.payload
      if (!figures || typeof figures !== 'object' || !Array.isArray(figures.tasks)) throw { code: 'bad_answer' }
      figures.prefs = { ...(figures.prefs || {}), ...localPrefs() }
      return figures
    },
    explain: error => WORDS[error && error.code] || 'A reading failed. Usage Desk will try again.',
    // After a refusal that repeating cannot fix, it checks back once a minute instead.
    // The extension restarts when the panel first opens, so that one is tried again soon.
    retryMs: error => (error && error.code === 'server_not_connected' ? 5000 : DENIED.includes(error && error.code) ? 60000 : 5000),
    act: async (task, action, isQuiet) => {
      if (isQuiet) return
      await ready
      if (!mcp) throw { code: 'no_app' }
      await mcp.callTool(SERVER, 'usage_action', { task, action }, { cache: false })
    },
    savePrefs: patch => {
      try { localStorage.setItem(PREFS, JSON.stringify({ ...localPrefs(), ...patch })) } catch {}
    },
  }
})()
</script>
<script>
// Generated from the Usage Desk mod's code. The owl is original art for this project; its outfit motions follow savvy-progress in johnnyvizz/claude-kit (MIT, see LICENSE-claude-kit).
const FONT = "ui-sans-serif,-apple-system,'Segoe UI',sans-serif"
const FIVE_H = 5 * 3600_000, WEEK = 7 * 24 * 3600_000, FIVE_M = 5 * 60_000, ONE_H = 3600_000
const DEFAULT_NAME = 'Main agent', FIVE_COLOR = '#378ADD', WEEK_COLOR = '#7F77DD', BAD = '#D0453F', GOOD = '#3B9C5F'
const COSTUMES = [
  { value: 'other', label: 'Classic owl' },
  { value: 'fable', label: 'Astronaut' },
  { value: 'heavy', label: 'Detective' },
  { value: 'careful', label: 'Engineer' },
  { value: 'medium', label: 'Chef' },
  { value: 'light', label: 'Racer' },
  { value: 'explore', label: 'Pirate' },
  { value: 'science', label: 'Scientist' },
]


// Usage Desk's own mascot: a pixel owl with one outfit per kind of work.
// Original art for this project. The outfit's accent follows the tier colours.
const TIER_COLOR                         = {
  fable: '#7F77DD',
  heavy: '#D85A30',
  careful: '#BA7517',
  medium: '#378ADD',
  light: '#1D9E75',
  explore: '#1D9E75',
  science: '#7BC043',
  other: '#888780',
}
const colorOf = (tier        )         => TIER_COLOR[tier] ?? '#888780'

// The owl sits on a 30×28 grid: a 16×13 body, wings either side, two stepping feet.
const PLUME = '#5B6B8C'
const BELLY = '#E9DFC7'
const SPOT = '#B9AC8E'
const BEAK = '#E0A63A'
const WHITE = '#FBFAF6'
const INK = '#1F1E1D'

// `cls` puts a pixel in a named group: `bd` (the default) is the body and its
// outfit, `la`/`lb` the two feet, anything else a prop with its own motion.


const stamp = (f      , x        , y        , rows          , map                        , cls         )       =>
  rows.forEach((row, dy) => [...row].forEach((ch, dx) => map[ch] && f(x + dx, y + dy, 1, 1, map[ch] ?? '', cls)))

// `wingUp` raises the front wing; `wingCls` lets it travel with the prop it holds.
const owlBody = (f      , wingUp = 0, wingCls         )       => {
  f(8, 8, 2, 1, PLUME); f(20, 8, 2, 1, PLUME)
  f(8, 9, 14, 13, PLUME); f(7, 10, 16, 11, PLUME)
  f(9, 11, 4, 4, WHITE); f(17, 11, 4, 4, WHITE)
  f(10, 12, 2, 2, INK); f(18, 12, 2, 2, INK)
  f(14, 14, 2, 2, BEAK)
  f(10, 16, 10, 5, BELLY)
  f(12, 17, 1, 1, SPOT); f(16, 17, 1, 1, SPOT); f(14, 19, 1, 1, SPOT); f(18, 19, 1, 1, SPOT)
  f(4, 14, 3, 5, PLUME)
  f(23, 14 + wingUp, 3, 5, PLUME, wingCls)
  f(10, 22, 1, 2, BEAK, 'la'); f(9, 24, 3, 1, BEAK, 'la')
  f(19, 22, 1, 2, BEAK, 'lb'); f(18, 24, 3, 1, BEAK, 'lb')
}

// Pure CSS, run by the compositor: no redraws. Periods divide one second, so the
// once-a-second redraw of a running row restarts them in phase. Every owl walks;
// each costume adds its prop's own motion on top.
const MASCOT_CSS = `<style>
.run .la{animation:st .5s steps(1) infinite}.run .lb{animation:st .5s steps(1) infinite -.25s}
.run .bd{animation:bob .5s steps(1) infinite -.125s}
.run g{transform-box:fill-box}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}
.c-fable.run{animation:float 1s ease-in-out infinite}
.c-fable.run .la,.c-fable.run .lb,.c-fable.run .bd{animation:none}
.c-fable.run .ant{animation:blink 1s steps(1) infinite}
.c-fable.run .star{animation:blink .5s steps(1) infinite -.25s}
@keyframes float{50%{transform:translateY(-2px)}}@keyframes blink{50%{opacity:.15}}
.c-heavy.run .it{animation:scan 1s steps(1) infinite}
.c-heavy.run .gl{animation:blink 1s steps(1) infinite -.5s}
@keyframes scan{25%{transform:translate(-1px,1px)}50%{transform:translate(-2px,2px)}75%{transform:translate(-1px,1px)}}
.c-careful.run .it{transform-origin:100% 100%;animation:twist .5s ease-in-out infinite}
@keyframes twist{50%{transform:rotate(-35deg)}}
.c-medium.run .pan{transform-origin:0 50%;animation:tilt 1s ease-in-out infinite}
.c-medium.run .egg{animation:flip 1s ease-in-out infinite}
@keyframes tilt{20%,40%{transform:rotate(-12deg)}}@keyframes flip{30%{transform:translateY(-5px) scaleY(-1)}60%{transform:translateY(0)}}
.c-light.run .la{animation-duration:.25s}.c-light.run .lb{animation-duration:.25s;animation-delay:-.125s}
.c-light.run .flag{transform-origin:0 50%;animation:wave .25s steps(1) infinite}
@keyframes wave{50%{transform:skewY(-12deg) scaleX(.85)}}
.c-explore.run .it{transform-origin:50% 100%;animation:fence .5s ease-in-out infinite}
@keyframes fence{50%{transform:rotate(25deg)}}
.c-science.run .it{transform-origin:50% 100%;animation:swirl 1s ease-in-out infinite}
.c-science.run .bub{animation:fizz .5s steps(1) infinite}
@keyframes swirl{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}@keyframes fizz{50%{transform:translateY(-1px);opacity:.3}}
@media (prefers-reduced-motion: reduce){.run,.run g{animation:none!important}}
</style>`

const OUTFITS                                               = {
  // Fable: astronaut in a glass dome; floats instead of walking, the antenna and the star blink.
  fable: (f, t) => {
    owlBody(f)
    f(8, 6, 14, 1, '#E6E8EE'); f(6, 7, 2, 1, '#E6E8EE'); f(22, 7, 2, 1, '#E6E8EE')
    f(5, 8, 1, 14, '#E6E8EE'); f(24, 8, 1, 14, '#E6E8EE'); f(6, 22, 18, 1, '#C9CCD2')
    f(6, 7, 18, 15, 'rgba(169,214,245,.3)'); f(8, 8, 1, 3, '#fff')
    f(14, 3, 2, 3, '#C9CCD2'); f(14, 1, 2, 2, t, 'ant'); f(13, 20, 4, 1, t)
    f(27, 3, 1, 3, '#F5C542', 'star'); f(26, 4, 3, 1, '#F5C542', 'star')
  },
  // Heavy: detective in a check cap; the magnifier sweeps and glints.
  heavy: (f, t) => {
    owlBody(f, -4, 'it')
    stamp(f, 6, 3, ['......bbbbbb......', '....bbcbbcbbcb....', '...bbbbbbbbbbbb...', '...tttttttttttt...', '.dddddddddddddddd.', '.d..............d.'], { b: '#7A4A26', c: '#A0703F', d: '#5A3519', t })
    stamp(f, 24, 2, ['.kk.', 'k..k', 'k..k', '.kk.'], { k: '#3A3A3C' }, 'it')
    f(25, 3, 2, 2, 'rgba(169,214,245,.7)', 'it'); f(25, 6, 1, 4, '#7A4A26', 'it'); f(25, 3, 1, 1, '#fff', 'gl')
  },
  // Careful: engineer in a hard hat; the wrench turns a bolt.
  careful: (f, t) => {
    owlBody(f)
    stamp(f, 6, 4, ['......yyyyyy......', '....yyyyhhyyyy....', '...yyyyyhhyyyyy...', '...yyyyyhhyyyyy...', '.dddddddddddddddd.'], { y: '#F5C542', h: '#FBE08A', d: '#C99A1E' })
    f(10, 6, 2, 2, t)
    stamp(f, 3, 10, ['s.s', 'sss', '.s.', '.s.'], { s: '#8E929A' }, 'it')
  },
  // Medium: chef in a puffed hat; tosses the omelette.
  medium: (f, t) => {
    owlBody(f, -4, 'pan')
    stamp(f, 7, 3, ['...ww..ww..ww...', '..wwwwwwwwwwww..', '.wwwwgwwwwgwwww.', '.wwwwwwwwwwwwww.', '..wwwwwwwwwwww..', '..bbbbbbbbbbbb..', '..bbbbbbbbbbbb..'], { w: '#F4F3EE', g: '#D2D1C8', b: t })
    f(23, 8, 6, 1, '#4A4A48', 'pan'); f(24, 9, 1, 2, '#4A4A48', 'pan'); f(25, 7, 2, 1, '#F5B731', 'egg')
  },
  // Light: racer in a helmet; runs at double pace, the checkered flag flutters.
  light: (f, t) => {
    owlBody(f, -4)
    stamp(f, 6, 5, ['.....rrrrrrrr.....', '...rrrrwwrrrrrr...', '..rrrrrwwrrrrrrr..', '..rrrrrwwrrrrrrr..', '..kkkkkkkkkkkkkk..'], { r: t, w: '#F8F6F1', k: INK })
    f(26, 1, 1, 9, '#8E929A')
    stamp(f, 27, 1, ['wkw', 'kwk', 'wkw'], { w: '#F8F6F1', k: INK }, 'flag')
  },
  // Explore: pirate scouting the code; the cutlass fences.
  explore: f => {
    owlBody(f)
    stamp(f, 5, 4, ['........kkkk........', '.....kkkkkkkkkk.....', '..kkkkkkkwwkkkkkkk..', '.kkkkkkkkkkkkkkkkkk.', '..gggggggggggggggg..'], { k: '#55514C', w: '#F8F6F1', g: '#F5C542' })
    f(8, 10, 9, 1, INK); f(17, 11, 4, 4, INK)
    f(26, 6, 1, 9, '#C9CCD2', 'it'); f(25, 15, 3, 1, '#7A4A26', 'it')
  },
  // Scientist: lab coat and safety goggles; swirls a flask that fizzes.
  science: (f, t) => {
    owlBody(f, -4, 'it')
    f(7, 15, 4, 7, '#F4F3EE'); f(19, 15, 4, 7, '#F4F3EE')
    f(11, 15, 1, 3, '#D2D1C8'); f(18, 15, 1, 3, '#D2D1C8')
    f(8, 19, 2, 1, '#D2D1C8'); f(9, 17, 1, 2, t)
    f(7, 12, 1, 1, '#3A3A3C'); f(22, 12, 1, 1, '#3A3A3C'); f(14, 12, 2, 1, '#3A3A3C')
    stamp(f, 8, 10, ['kkkkkk', 'k....k', 'k....k', 'k....k', 'k....k', 'kkkkkk'], { k: '#3A3A3C' })
    stamp(f, 16, 10, ['kkkkkk', 'k....k', 'k....k', 'k....k', 'k....k', 'kkkkkk'], { k: '#3A3A3C' })
    f(9, 11, 4, 4, 'rgba(169,214,245,.3)'); f(17, 11, 4, 4, 'rgba(169,214,245,.3)')
    stamp(f, 24, 3, ['.ggg.', '..g..', '..g..', '.glg.', 'glllg', 'glllg', 'ggggg'], { g: '#DCE6EC', l: t }, 'it')
    f(26, 1, 1, 1, t, 'bub'); f(27, 0, 1, 1, t, 'bub')
  },
  other: f => owlBody(f),
}

const MASCOT_BOX = 30
const MASCOT_SCALE = 1.1

// Body and props nest inside `bd` so a prop rides the bob and adds its own motion;
// feet stay outside it and step on their own. `mirror` flips the owl inside its
// own box (x .. x + MASCOT_BOX * scale) so it faces left.
const mascot = (x        , y        , costume        , dim = false, isWalking = false, scale = MASCOT_SCALE, mirror = false)         => {
  const groups = new Map                  ([['bd', []]])
  const f       = (cx, cy, w, h, c, cls = 'bd') => {
    if (!groups.has(cls)) groups.set(cls, [])
    groups.get(cls)?.push(`<rect x="${cx}" y="${cy}" width="${w}" height="${h}" fill="${c}"/>`)
  }
  const draw = OUTFITS[costume] ?? ((g      ) => owlBody(g))
  draw(f, colorOf(costume))
  const group = (cls        ) => `<g class="${cls}">${(groups.get(cls) ?? []).join('')}</g>`
  const props = [...groups.keys()].filter(k => k !== 'bd' && k !== 'la' && k !== 'lb')
  const body = `<g class="bd">${(groups.get('bd') ?? []).join('')}${props.map(group).join('')}</g>`
  const place = mirror ? `translate(${x + MASCOT_BOX * scale},${y}) scale(${-scale},${scale})` : `translate(${x},${y}) scale(${scale})`
  return `<g transform="${place}" opacity="${dim ? 0.45 : 1}" shape-rendering="crispEdges"><g class="c-${costume}${isWalking ? ' run' : ''}">${body}${group('la')}${group('lb')}</g></g>`
}

// The drawing helpers below were written for the earlier mascot and keep its names.
const CRAB_CSS = MASCOT_CSS, CRAB_BOX = MASCOT_BOX, crab = mascot

// ---------- Words and numbers

const cleanName = (value        )         => value.replace(/\s+/g, ' ').trim().slice(0, 28) || DEFAULT_NAME

const fmtTokens = (n        )         => {
  if (n >= 1e9) return `${(n / 1e9).toFixed(1)}B`
  if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`
  if (n >= 1e3) return `${(n / 1e3).toFixed(n >= 1e4 ? 0 : 1)}k`
  return String(Math.round(n))
}
const plural = (n        , word        ) => `${n} ${word}${n === 1 ? '' : 's'}`
const replyWord = (n        ) => `${n} repl${n === 1 ? 'y' : 'ies'}`
const mmss = (ms        ) => {
  const s = Math.max(0, Math.ceil(ms / 1000))
  return s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
}
const resetWords = (iso        , at        )         => {
  const t = Date.parse(iso)
  if (!Number.isFinite(t) || !iso) return ''
  const ms = t - at
  if (ms <= 0) return 'resetting'
  const h = Math.floor(ms / ONE_H)
  if (h >= 24) return `resets ${Math.floor(h / 24)}d ${h % 24}h`
  if (h >= 1) return `resets ${h}h ${Math.floor((ms % ONE_H) / 60_000)}m`
  return `resets ${Math.ceil(ms / 60_000)}m`
}
const agoWords = (ms        ) => {
  const m = Math.floor(ms / 60_000)
  if (m < 1) return 'just now'
  if (m < 60) return `${m} min ago`
  const h = Math.floor(m / 60)
  return h < 24 ? `${h} h ago` : `${Math.floor(h / 24)} d ago`
}
const xml = (s        ) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
const baseName = (path        ) => path.split(/[\\/]/).filter(Boolean).pop() ?? path
const shortLabel = (label        ) => (/^[/~]/.test(label) ? baseName(label) : label).slice(0, 60)
const modelName = (id        )         => {
  const m = /(fable|mythos|opus|sonnet|haiku)-(\d+)(?:-(\d{1,2})(?!\d))?/i.exec(id)
  if (!m) return id || 'Claude'
  const family = m[1] ?? ''
  return `${family[0]?.toUpperCase() ?? ''}${family.slice(1)} ${m[2]}${m[3] ? `.${m[3]}` : ''}`
}
const friendlyTool = (tool        )         => {
  if (!tool.startsWith('mcp__')) return tool
  const [, server = '', name = ''] = tool.split('__')
  return `${server.replace(/^plugin_[^_]*_/, '')}: ${name.replace(/_/g, ' ')}`
}
// Tool names mean little to most people: what Claude did, in plain words.
const JOBS                         = {
  Read: 'Read a file', Edit: 'Edited a file', MultiEdit: 'Edited a file', NotebookEdit: 'Edited a file', Write: 'Wrote a file',
  Grep: 'Searched inside files', Glob: 'Looked for files', WebSearch: 'Searched online', WebFetch: 'Opened a web page',
  Bash: 'Ran a command', Agent: 'Started a helper', Task: 'Started a helper', Skill: 'Used a skill', AskUserQuestion: 'Asked you a question', Artifact: 'Made a page',
}
const APPS                     = [[/chrome/i, 'Chrome'], [/browser/i, 'the browser'], [/gmail/i, 'Gmail'], [/calendar/i, 'Calendar'], [/drive/i, 'Google Drive'], [/sheets/i, 'Google Sheets'], [/docs/i, 'Google Docs'], [/slack/i, 'Slack'], [/notion/i, 'Notion'], [/figma/i, 'Figma'], [/linear/i, 'Linear']]
const appName = (server        )         => {
  const named = APPS.find(([re]) => re.test(server))?.[1]
  if (named) return named
  if (/^[0-9a-f]{8}-/i.test(server)) return 'a connected app'
  return server.replace(/^plugin_[^_]*_/, '').replace(/[-_]/g, ' ')
}
// The app's own housekeeping and tool lookups are not jobs anyone asked for.
const isHousekeeping = (tool        )          => /usage[-_]desk|Claude_Browser__(preview_start|request_access)|^mcp__(ccd_|plugin-authoring|terminal__read)/i.test(tool) || /^(ToolSearch|TodoWrite|TaskCreate|TaskUpdate|TaskList|TaskGet|Monitor|ListAgents)$/.test(tool)
const jobOf = (tool        )         => {
  if (JOBS[tool]) return JOBS[tool]          
  if (tool.startsWith('mcp__')) return `Used ${appName(tool.split('__')[1] ?? '')}`
  return `Used ${tool}`
}
const WORK                         = { Read: 'Reading files', Bash: 'Running commands', WebFetch: 'Opening web pages', WebSearch: 'Searching online', Grep: 'Searching inside files', Glob: 'Looking for files', Skill: 'Using skills', Agent: 'Starting helpers', Edit: 'Editing files', Write: 'Writing files' }
const workOf = (tool        )         => WORK[tool] ?? (tool.startsWith('mcp__') ? jobOf(tool) : tool)
const jobSummary = (counts                        )         => {
  const total                         = {}
  for (const [tool, n] of Object.entries(counts)) {
    if (isHousekeeping(tool)) continue
    const job = jobOf(tool)
    total[job] = (total[job] ?? 0) + n
  }
  return Object.entries(total).sort((x, y) => y[1] - x[1]).slice(0, 6).map(([job, n]) => `${job} × ${n}`).join(' · ')
}

const connectorOf = (tool        )         => (tool.startsWith('mcp__') ? (tool.split('__')[1] ?? '') : '')

// The label a tool call gets in the live list. Paths and searches, never file contents.
const labelOf = (e                         )         => {
  for (const key of ['file_path', 'path', 'notebook_path', 'url', 'query', 'pattern', 'description', 'skill', 'command']) {
    const v = e[key]
    if (typeof v === 'string' && v) return shortLabel(v.split('\n')[0] ?? '')
  }
  return ''
}

// /context names its colours by theme key; a drawing needs real ones.
const THEME                         = {
  promptBorder: '#888780', inactive: '#6B6B66', permission: '#7F77DD', planMode: '#1D9E75', autoAccept: '#A06CD5',
  warning: '#D9A441', success: '#3B9C5F', error: '#D0453F', claude: '#D97757', suggestion: '#378ADD', bashBorder: '#D45D9B',
  ide: '#4F86C6', remember: '#378ADD', fastMode: '#E07B39', text: '#B5B5B0', subtle: '#9A9A96', secondaryText: '#9A9A96',
  merged: '#A06CD5', professionalBlue: '#378ADD', chromeYellow: '#D9A441',
}
const SPARE = ['#D97757', '#378ADD', '#1D9E75', '#7F77DD', '#D9A441', '#D45D9B', '#4F86C6', '#A06CD5']
const hexOf = (key        )         => {
  if (key.startsWith('#')) return key
  if (THEME[key]) return THEME[key]          
  let h = 0
  for (const ch of key) h = (h * 31 + ch.charCodeAt(0)) % 997
  return SPARE[h % SPARE.length]          
}

// The Context side panel's colours, so the two read the same.
const CATEGORY                     = [
  [/server instructions/i, '#8E8E8A'],
  [/message/i, '#3B82F6'],
  [/system tools/i, '#EA6A2A'],
  [/mcp tools/i, '#10B981'],
  [/system prompt/i, '#E09F1F'],
  [/skill/i, '#B8B8B4'],
  [/memory/i, '#A06CD5'],
  [/agent/i, '#D45D9B'],
  [/buffer|compact/i, '#6F6F6B'],
  [/free/i, '#3A3A38'],
]
const categoryColor = (name        )         => CATEGORY.find(([re]) => re.test(name))?.[1] ?? hexOf(name)
const categoryRank = (c          )         => (c.kind === 'free' ? 2 : c.kind === 'buffer' ? 1 : 0)
const categoryOrder = (x          , y          )         => categoryRank(x) - categoryRank(y) || y.tokens - x.tokens

// List prices per million tokens (input, output, cache read, 1-hour cache write), checked 2026-11-05.
const PRICES                                               = [
  [/(fable|mythos)-5-1/, [10, 50, 0.25, 20]],
  [/fable|mythos/, [10, 50, 1, 20]],
  [/opus-5-5/, [4, 20, 0.2, 8]],
  [/opus/, [5, 25, 0.5, 10]],
  [/sonnet-5-5/, [2, 10, 0.1, 4]],
  [/sonnet-5/, [2, 10, 0.2, 4]],
  [/sonnet/, [3, 15, 0.3, 6]],
  [/haiku-5-5/, [0.1, 0.5, 0.01, 0.2]],
  [/haiku/, [1, 5, 0.1, 2]],
]
const HAIKU_LONG = [0.5, 2.5, 0.05, 1]
const costOf = (model        , t                                                                          )         => {
  // Haiku 5.5 costs more on a request whose prompt is over 100,000 tokens, which every Cowork request is.
  const prompt = t.requests ? (t.input + t.cacheRead + t.cacheWrite) / t.requests : 0
  const q = /haiku-5-5/.test(model) && prompt > 100000 ? HAIKU_LONG : PRICES.find(([re]) => re.test(model))?.[1] ?? [4, 20, 0.2, 8]
  return (t.input * q[0] + t.output * q[1] + t.cacheRead * q[2] + t.cacheWrite * q[3]) / 1e6
}
const fmtCost = (usd        )         => `$${usd >= 100 ? Math.round(usd) : usd.toFixed(2)}`
const clockTime = (ms        )         => {
  const sec = Math.floor(ms / 1000)
  const h = Math.floor(sec / 3600)
  const m = Math.floor((sec % 3600) / 60)
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}` : `${m}:${String(sec % 60).padStart(2, '0')}`
}


// ---------- Explanations, written from what was measured

                                                                                       
                                                                                                    


// Every reply re-reads the whole chat, so what matters is its size, not its share of the window.
const BIG_CHAT = 150_000
// Cowork starts every task with a lot of its own text, so only what the task added counts here.
const addedByTask = s => { const c = s.scan?.chat; return c ? c.yourTokens + c.claudeTokens + c.thinkingTokens + c.toolInputTokens + c.toolResultTokens : 0 }
const isBigChat = s => addedByTask(s) >= 100_000 || s.chatPercent >= 50

function explain(name        , tokens        , s          )      {
  const c = s.scan?.chat
  const b = s.breakdown
  const low = name.toLowerCase()
  const percent = s.chatWindow ? Math.round((tokens / s.chatWindow) * 100) : 0
  const lead = `${fmtTokens(tokens)} tokens, ${percent}% of this task's space.`
  const isBig = isBigChat(s)
  if (low.includes('message') && c) {
    const avg = c.replies ? Math.round(c.cacheRead / c.replies) : 0
    const total = c.yourTokens + c.claudeTokens + c.thinkingTokens + c.toolInputTokens + c.toolResultTokens + c.appTokens
    const top = [
      { n: 'Results of jobs', v: c.toolResultTokens },
      { n: 'Job requests', v: c.toolInputTokens },
      { n: 'Your messages', v: c.yourTokens },
      { n: "Claude's replies", v: c.claudeTokens },
      { n: 'Thinking', v: c.thinkingTokens },
      { n: 'Setup and reminders from Cowork', v: c.appTokens },
    ].sort((x, y) => y.v - x.v)
    const main = top[0]
    const lines = [
      lead,
      `This task holds ${plural(c.yourMessages, 'message')} from you and ${plural(c.toolCalls, 'job')} Claude did. Claude re-reads all of it on every reply, about ${fmtTokens(avg)} tokens each time, across ${replyWord(c.replies)} so far.`,
    ]
    if (main && total) lines.push(`The biggest part is ${main.n.toLowerCase()}, about ${Math.round((main.v / total) * 100)}%. These parts are estimates and will not add up exactly to the total.`)
    if (c.coldRebuilds) lines.push(`The cache went cold ${plural(c.coldRebuilds, 'time')}, which rewrote ${fmtTokens(c.coldTokens)} tokens at the higher price.`)
    const fixes        = []
    if (isBig) fixes.push({ key: 'compact', label: 'Compact now', act: 'compact' }, { key: 'handoff', label: 'Draft a handoff', act: 'handoff' })
    else lines.push(`Nothing to fix yet. Compacting pays off more once a task passes about ${fmtTokens(BIG_CHAT)} tokens.`)
    return { lines, fixes, rows: [...top.map(t => ({ name: t.n, value: `~${fmtTokens(t.v)}` })), ...c.largest.slice(0, 4).map(l => ({ name: `${workOf(l.tool)}${l.label ? ` · ${shortLabel(l.label)}` : ''}`, value: `~${fmtTokens(l.tokens)}`, note: 'largest' }))] }
  }
  if (low.includes('mcp') && b) {
    return {
      lines: [lead, `${plural(b.mcp.length, 'connector')} loaded tool descriptions here, and they are re-read on every reply even when unused. Turn off the ones this task does not need.`],
      fixes: [],
      rows: [...b.mcp].sort((x, y) => y.tokens - x.tokens).map(m => ({ name: m.name, value: fmtTokens(m.tokens), note: m.detail })),
    }
  }
  if (low.includes('memory') && b) {
    return { lines: [lead, 'These instruction files load into every task, so trimming them saves tokens everywhere.'], fixes: [], rows: [...b.memory].sort((x, y) => y.tokens - x.tokens).map(m => ({ name: m.name, value: fmtTokens(m.tokens), note: m.detail })) }
  }
  if (low.includes('skill') && b) {
    return { lines: [lead, 'Each installed skill adds a short description here. Disabling plugins you never use shrinks it.'], fixes: [], rows: [...b.skills].sort((x, y) => y.tokens - x.tokens).slice(0, 12).map(m => ({ name: m.name, value: fmtTokens(m.tokens) })) }
  }
  if (low.includes('agent') && b) {
    return { lines: [lead, 'Descriptions of the agent types Claude can start.'], fixes: [], rows: [...b.agents].sort((x, y) => y.tokens - x.tokens).map(m => ({ name: m.name, value: fmtTokens(m.tokens) })) }
  }
  if (low.includes('free')) return { lines: [`${fmtTokens(tokens)} tokens are still free in this task.`], fixes: [], rows: [] }
  if (low.includes('buffer') || low.includes('compact')) return { lines: [lead, 'Space held back so Claude can summarise the task when it fills up. You cannot use it for messages.'], fixes: [], rows: [] }
  if (low.includes('system prompt')) return { lines: [lead, "Claude's built-in instructions. They load in every task and you cannot trim them."], fixes: [], rows: [] }
  if (low.includes('tool')) return { lines: [lead, 'Descriptions of the built-in tools. They load in every task and you cannot trim them.'], fixes: [], rows: [] }
  return { lines: [lead], fixes: [], rows: [] }
}

// Why one reply or one job took the tokens it did, from that request's own figures.
function explainRow(row             )           {
  const lines           = []
  const reread = row.reread > 0 ? `To do this, Claude also re-read ${fmtTokens(row.reread)} tokens of the task from the cache. Those re-reads cost far less per token than new text, but they repeat on every reply.` : ''
  if (row.kind === 'reply') {
    const written = row.tokens - row.thinking
    lines.push(row.thinking > 0 ? `Claude produced ${fmtTokens(row.tokens)} tokens: about ${fmtTokens(written)} of writing and ${fmtTokens(row.thinking)} of thinking first.` : `Claude wrote ${fmtTokens(row.tokens)} tokens for this reply.`)
    if (row.fresh > 0) lines.push(`${fmtTokens(row.fresh)} tokens were new to the task at that point, such as your message and any job results.`)
    if (reread) lines.push(reread)
    if (row.thinking > written && row.thinking > 200) lines.push('Most of this was thinking. A lower effort setting usually means less of it.')
  } else {
    const job = jobOf(row.tool).toLowerCase()
    lines.push(`About ${fmtTokens(row.tokens)} tokens went into the task when Claude ${job}. That counts the request and what came back. It is an estimate from the text's length.`)
    lines.push('It stays in the task, so Claude re-reads it on every later reply until the task is compacted.')
    if (reread) lines.push(reread)
    if (row.tokens > 5000) lines.push(row.tool === 'Read' ? 'This is a big file. Pointing Claude to the part you need would use less.' : 'This is a big result. Asking for something narrower would use less.')
    if (row.isError) lines.push('This job failed, so those tokens brought nothing useful back.')
  }
  return lines
}

function explainFiles(s          )      {
  const c = s.scan?.chat
  if (!c) return { lines: ['No log for this task yet.'], fixes: [], rows: [] }
  const repeat = c.files.filter(f => f.reads > 1)
  const lines = [`Claude read ${plural(c.files.length, 'file')} here, and every file stays in the task and is re-read on each reply.`]
  if (repeat[0]) lines.push(`${baseName(repeat[0].path)} was read ${repeat[0].reads} times. Pointing Claude to the part you need avoids that.`)
  return { lines, fixes: [], rows: c.files.map(f => ({ name: baseName(f.path), value: `~${fmtTokens(f.tokens)}`, note: plural(f.reads, 'read') })) }
}

function explainTools(s          )      {
  const c = s.scan?.chat
  if (!c) return { lines: ['No log for this task yet.'], fixes: [], rows: [] }
  const rows = [...c.tools, ...c.connectors.filter(x => !x.name.startsWith('ccd_')).map(x => ({ ...x, name: `Used ${appName(x.name)}` }))].sort((x, y) => y.tokens - x.tokens)
  const top = rows[0]
  const lines = [`What Claude's jobs brought back takes about ${fmtTokens(c.toolResultTokens)} tokens, and it stays in the task after the job ends.`]
  if (top) lines.push(`${workOf(top.name)} added the most.`)
  return { lines, fixes: [], rows: rows.map(t => ({ name: workOf(t.name), value: `~${fmtTokens(t.tokens)}`, note: plural(t.calls, 'time') })) }
}

function explainWindow(w            , chat         )           {
  const avg = chat.replies ? Math.round((chat.cacheRead + chat.input) / chat.replies) : 0
  const lines = [`About ${chat.share}% of the usage tracked in this window. ${replyWord(chat.replies)}, re-reading about ${fmtTokens(avg)} tokens each.`]
  const parts = [
    { n: 're-reading the task from cache', v: chat.cacheRead * 0.05 },
    { n: 'saving new content to the cache', v: chat.cacheWrite * 2 },
    { n: "Claude's replies", v: chat.output * 5 },
    { n: 'uncached input', v: chat.input },
  ].sort((x, y) => y.v - x.v)
  if (parts[0]) lines.push(`Its biggest cost is ${parts[0].n}.`)
  if (w.chatCount > 15) lines.push(`Showing the top 15 of ${w.chatCount} chats.`)
  return lines
}

const textWidth = (s        , size        )         => [...s].reduce((w, ch) => w + (/[iljtf.,:;·' ]/.test(ch) ? 0.3 : /[A-Z%mw]/.test(ch) ? 0.72 : 0.54) * size, 0)
const fitText = (s        , size        , maxW        )         => {
  if (textWidth(s, size) <= maxW) return s
  let out = ''
  for (const ch of s) {
    if (textWidth(`${out}${ch}…`, size) > maxW) break
    out += ch
  }
  return `${out}…`
}

  return `<defs><clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"/></clipPath></defs><g clip-path="url(#${id})"><rect class="k" x="${x}" y="${y}" width="${w}" height="${h}"/>${rects}</g>`

  return [
    { label: 'Claude replies', tokens: t.output, color: '#D97757' },
    { label: 'New context', tokens: t.input + t.cacheWrite, color: '#378ADD' },
    { label: 'Re-read from cache', tokens: t.cacheRead, color: '#888780' },
  ].map(s => ({ ...s, share: (s.tokens / total) * 100 }))
}

const lookOf = (a          ) => (a.type === 'Explore' ? 'explore' : /fable|mythos/.test(a.model) ? 'fable' : /opus/.test(a.model) ? 'heavy' : /sonnet/.test(a.model) ? 'medium' : /haiku/.test(a.model) ? 'light' : 'other')
const TIER                         = { fable: '#7F77DD', heavy: '#D85A30', medium: '#378ADD', light: '#1D9E75', explore: '#1D9E75', other: '#888780' }



</script>
<script>
// Draws the window from the latest figures. The layout follows the Usage Desk mod's panel.
(function () {
  // The page that loads this file says how figures are read and buttons are sent.
  const T = window.usageDeskTransport
  const root = document.getElementById('root')
  const p = { open: '', detail: '', task: '', confirm: '', sent: '', showActivity: true, showLooks: false, job: '', moreJobs: false, isRenaming: false }
  let data = null
  let isConnected = false
  let handlers = []
  let lastHtml = ''
  let problem = ''

  // A quiet action is a nicety the page asks for by itself, never one the person pressed.
  const act = (action, isQuiet = false) => {
    if (!data?.task) return
    Promise.resolve(T.act(data.task.id, action, isQuiet)).catch(error => {
      p.sent = T.explain ? T.explain(error) : 'That did not go through.'
      draw()
    })
  }
  const set = patch => {
    Object.assign(p, patch, { confirm: '', sent: '' })
    draw()
  }

  // ---------- Pieces of the page

  const press = (name, html, alt, run) => {
    handlers.push(run)
    return `<div class="press" role="button" tabindex="0" aria-label="${xml(alt)}" data-p="${handlers.length - 1}" data-k="${xml(name)}">${html}</div>`
  }
  const button = (name, label, run, cls = '') => {
    handlers.push(run)
    return `<button class="${cls}" data-p="${handlers.length - 1}" data-k="${xml(name)}">${xml(label)}</button>`
  }
  const para = (words, cls = '') => `<p class="${cls}">${xml(words)}</p>`
  const row = (name, value, note, color) => `<div class="row"><span class="name">${color ? `<span class="dot" style="background:${xml(color)}"></span>` : ''}${xml(name)}${note ? `<span class="note">${xml(note)}</span>` : ''}</span><span class="value">${xml(value)}</span></div>`
  const stack = (...parts) => `<div class="stack">${parts.join('')}</div>`
  const section = (...parts) => `<div class="section">${parts.join('')}</div>`
  const back = onPress => button('back', '‹ Back', onPress, 'plain')

  function why(title, y) {
    return section(
      back(() => set({ detail: '' })),
      `<p><b>${xml(title)}</b></p>`,
      ...y.lines.map(line => para(line)),
      y.rows.length ? stack(...y.rows.map(r => row(r.name, r.value, r.note))) : '',
      y.fixes.length ? `<div class="inline">${y.fixes.map(fix => fixButton(fix)).join('')}</div>` : '',
    )
  }

  function fixButton(fix) {
    if (fix.act !== 'none' && !data.task?.state?.link?.isOpen) return ''
    if (fix.act === 'compact') {
      const isAsking = p.confirm === 'compact'
      return button(`fix-${fix.key}`, isAsking ? 'Confirm: compact this task' : fix.label, () => {
        if (!isAsking) {
          p.confirm = 'compact'
          p.sent = ''
        } else {
          act('compact')
          p.confirm = ''
          p.sent = 'Asked the task to compact.'
        }
        draw()
      }, isAsking ? 'primary' : '')
    }
    return button(`fix-${fix.key}`, fix.label, () => {
      act(fix.act)
      p.sent = 'Asked the task.'
      draw()
    })
  }

  function chatSection(s, W) {
    const b = s.breakdown
    if (!b) return para("The breakdown appears after Claude's first reply.", 'dim')
    if (p.detail === 'files') return why('Files read', explainFiles(s))
    if (p.detail === 'tools') return why('Results of jobs', explainTools(s))
    const picked = b.categories.find(x => x.name === p.detail)
    if (picked) return why(picked.name, explain(picked.name, picked.tokens, s))
    const g = gridSvg(W, b.grid)
    const sc = s.scan?.chat
    const pct = n => (s.chatWindow ? `${((n / s.chatWindow) * 100).toFixed(1)}%` : '')
    return section(
      b.grid.length ? g.source : '',
      stack(
        ...[...b.categories].sort(categoryOrder).map(x => press(`cat-${x.name}`, legendSvg(W, categoryColor(x.name), x.name, fmtTokens(x.tokens), pct(x.tokens)), `${x.name} ${fmtTokens(x.tokens)}`, () => set({ detail: x.name }))),
        sc && sc.files.length ? press('d-files', legendSvg(W, '#888780', 'Files read', String(sc.files.length), ''), `Files read ${sc.files.length}`, () => set({ detail: 'files' })) : '',
        sc && sc.toolResultTokens ? press('d-tools', legendSvg(W, '#888780', 'Results of jobs', `~${fmtTokens(sc.toolResultTokens)}`, ''), `Results of jobs ${fmtTokens(sc.toolResultTokens)}`, () => set({ detail: 'tools' })) : '',
      ),
      s.chatTokens > addedByTask(s) ? para(`About ${fmtTokens(s.chatTokens - addedByTask(s))} of this is Cowork's own setup, there before your first message. Every reply re-reads it from the cache.`, 'dim') : '',
      sc ? para(`Whole task so far: ${fmtTokens(sc.output)} written by Claude, ${fmtTokens(sc.input + sc.cacheWrite)} new context, ${fmtTokens(sc.cacheRead)} re-read from cache.`, 'dim') : '',
    )
  }

  // The 5-hour and weekly sections: which Cowork tasks the tracked usage came from.
  function windowSection(name, limit, length, color, at, W) {
    const resetAt = limit?.resetsAt ? Date.parse(limit.resetsAt) : NaN
    const start = Number.isFinite(resetAt) && resetAt > at ? resetAt - length : at - length
    const tasks = data.tasks.filter(t => t.tokens > 0 && t.updatedAt >= start)
    const costed = tasks.map(t => { const list = Object.entries(t.steps ?? {}); return { ...t, cost: t.isMeasured && list.length ? list.reduce((n, [model, row]) => n + costOf(model, row), 0) : t.chatCost } })
    const totalCost = costed.reduce((sum, t) => sum + t.cost, 0) || 1
    const rows = costed.map(t => ({ ...t, title: t.title || `Task started ${new Date(t.startedAt).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`, project: 'Cowork', lastAt: t.updatedAt, share: Math.round((t.cost / totalCost) * 100) }))
    const picked = rows.find(t => t.id === p.task)
    if (picked) {
      return section(
        back(() => set({ task: '' })),
        `<p><b>${xml(picked.title)}</b></p>`,
        para(`Last active ${agoWords(at - picked.lastAt)}`, 'dim'),
        ...explainWindow({ chatCount: rows.length }, picked).map(t => para(t)),
        stack(...tokenSegments(picked).map(x => row(x.label, fmtTokens(x.tokens), '', x.color))),
      )
    }
    const sum = key => tasks.reduce((n, t) => n + t[key], 0)
    return section(
      para(limit ? `${limit.percent}% of your ${name} limit is used, as reported by Claude.` : `No ${name} reading yet.`),
      para('The tokens and tasks below are from Cowork only. Code tab chats and claude.ai also count towards this limit, but they cannot be seen from here.', 'dim'),
      stack(...tokenSegments({ input: sum('input'), output: sum('output'), cacheWrite: sum('cacheWrite'), cacheRead: sum('cacheRead') }).map(x => row(x.label, fmtTokens(x.tokens), '', x.color))),
      rows.length ? para(`Tasks · ${rows.length} · estimated share of tracked usage`, 'dim') : para('No Cowork tasks in this window.', 'dim'),
      stack(...rows.map(t => press(`task-${t.id}`, chatSvg(W, t, color, at), `${t.title} ${t.share}%`, () => set({ task: t.id })))),
    )
  }

  function agentCard(a, s, at) {
    const look = lookOf(a)
    const end = a.status === 'running' ? at : a.endedAt
    return {
      look, isWalking: a.status === 'running', title: a.description || a.type, tag: a.type, tagColor: TIER[look] ?? '#888780', meta: modelName(a.model),
      left: a.current && a.status === 'running' ? shortLabel(a.current) : plural(a.steps, 'step'),
      stats: `${fmtTokens(a.tokens)}  ≈${fmtCost(costOf(a.model, a))}  ${clockTime(Math.max(0, end - a.startedAt))}`,
      ratio: Math.min(1, a.contextTokens / (s.chatWindow || 200000)), barColor: TIER[look] ?? '#888780', status: a.status,
    }
  }

  function agentList(words, list, s, at, W) {
    if (!list.length) return ''
    return section(para(`${words} · ${list.length}`, 'dim'), stack(...list.map(a => {
      const id = `agent:${a.id}`
      const opened = p.open === id ? stack(a.current ? para(`Now: ${a.current}`, 'dim') : '', ...tokenSegments(a).map(x => row(x.label, fmtTokens(x.tokens), '', x.color))) : ''
      return press(`a-${a.id}`, agentSvg(W, agentCard(a, s, at)), `${a.description}, ${a.status}`, () => set({ open: p.open === id ? '' : id, detail: '', task: '' })) + opened
    })))
  }

  function activity(l, s, at, W) {
    const busy = l.recent.filter(r => !isHousekeeping(r.tool) && !r.isDone).slice(-4).reverse()
    const timeline = (s.scan?.chat?.timeline ?? []).filter(r => r.kind === 'reply' || !isHousekeeping(r.tool)).reverse()
    const parts = [button('live-t', `${p.showActivity ? '▾' : '▸'} What Claude did`, () => { p.showActivity = !p.showActivity; draw() }, 'plain')]
    if (p.showActivity) {
      if (!busy.length && !timeline.length) parts.push(para('Nothing yet. Each reply and job shows up here with the tokens it took.', 'dim'))
      const summary = jobSummary(l.counts)
      if (summary) parts.push(para(summary, 'dim'))
      for (const r of busy) parts.push(`<p><span style="color:#D97757">●</span> ${xml(jobOf(r.tool))}${r.label ? `<span class="dim">: ${xml(r.label.slice(0, 44))}</span>` : ''}</p>`)
      for (const r of timeline.slice(0, p.moreJobs ? 40 : 10)) {
        const name = r.kind === 'reply' ? 'Replied' : `${jobOf(r.tool)}${r.label ? `: ${shortLabel(r.label)}` : ''}`
        const value = `${r.kind === 'job' ? '~' : ''}${fmtTokens(r.tokens)}`
        const isOpen = p.job === r.id
        parts.push(press(`job-${r.id}`, jobSvg(W, r.isError ? BAD : r.kind === 'reply' ? '#D97757' : GOOD, name, value, isOpen), `${name}, ${value} tokens`, () => { p.job = isOpen ? '' : r.id; draw() }))
        if (isOpen) parts.push(section(...explainRow(r).map(t => para(t))))
      }
      if (timeline.length > 10) parts.push(button('more', p.moreJobs ? 'Show fewer' : `Show more (${Math.min(timeline.length, 40)})`, () => { p.moreJobs = !p.moreJobs; draw() }, 'plain'))
      const apps = Object.entries(l.connectors).filter(([k]) => !k.startsWith('ccd_') && !/usage[-_]desk/i.test(k)).map(([k, n]) => `${appName(k)} (${n})`)
      if (l.files.length) parts.push(para(`Files touched: ${l.files.map(f => shortLabel(f)).slice(-8).join(', ')}`, 'dim'))
      if (apps.length) parts.push(para(`Apps used: ${apps.join(', ')}`, 'dim'))
      if (l.skills.length) parts.push(para(`Skills used: ${l.skills.join(', ')}`, 'dim'))
    }
    return section(...parts)
  }

  // ---------- The whole page

  function saved(limit, percent, readAt, at, length) {
    if (limit) return limit
    if (typeof percent !== 'number' || !readAt || at - readAt >= length) return null
    return { percent, resetsAt: '', isLive: false, readAt }
  }

  function view() {
    handlers = []
    const at = Date.now()
    const W = Math.max(220, Math.min(640, root.clientWidth))
    const task = data.task
    const state = task?.state ?? {}
    const prefs = data.prefs ?? {}
    const name = prefs.name || DEFAULT_NAME
    const look = prefs.costume || 'other'
    const base = state.snapshot ?? { chatTokens: 0, chatWindow: 0, chatPercent: 0, model: '', cost: 0, startedAt: 0 }
    const limits = data.limits ?? {}
    const s = {
      ...base,
      five: saved(base.five, limits.fiveHour, limits.readAt, at, FIVE_H),
      week: saved(base.week, limits.weekly, limits.readAt, at, WEEK),
      breakdown: state.breakdown ?? null,
      scan: state.scan ?? null,
      model: state.breakdown?.model || base.model,
    }
    const isFresh = task && at - task.updatedAt < 30000
    // A task that stopped reporting long ago is history, not the task in front of the person.
    const isStale = !!task && at - task.updatedAt > 10 * 60000
    const l = { recent: [], counts: {}, files: [], skills: [], connectors: {}, ...(state.live ?? {}) }
    const isWorking = !!(l.isWorking && isFresh)
    if (!isWorking) l.recent = l.recent.map(r => ({ ...r, isDone: true }))
    const list = state.agents ?? []
    const c = state.cache ?? { lastEnd: 0, ttlMs: FIVE_M, isKnown: false, tokens: 0 }
    const w = state.warm ?? { isOn: false, pings: 0, isSending: false, note: '' }
    // Each request's own figures, where the task measured them, in place of Cowork's sparse log.
    const measured = Object.entries(state.steps ?? {})
    const pick = name => measured.reduce((n, [, row]) => n + (row[name] || 0), 0)
    const logged = s.scan?.chat ? s.scan.chat.input + s.scan.chat.output + s.scan.chat.cacheWrite + s.scan.chat.cacheRead : 0
    // The measured figures start over when the plugin reloads, so the fuller of the two counts wins.
    if (s.scan?.chat && measured.length && pick('input') + pick('output') + pick('cacheWrite') + pick('cacheRead') >= logged) {
      s.scan = { ...s.scan, chat: { ...s.scan.chat, input: pick('input'), output: pick('output'), cacheWrite: pick('cacheWrite'), cacheRead: pick('cacheRead'), replies: pick('requests'), cost: measured.reduce((n, [model, row]) => n + costOf(model, row), 0) } }
    }
    // The window's own address holds its private key, so opening it is never listed.
    if (s.scan?.chat?.largest) s.scan = { ...s.scan, chat: { ...s.scan.chat, largest: s.scan.chat.largest.filter(row => !isHousekeeping(row.tool) && !/127\.0\.0\.1/.test(row.label)) } }
    const sc = s.scan?.chat
    const whole = sc ? sc.input + sc.output + sc.cacheWrite + sc.cacheRead + sc.subagentTokens : 0
    const canAct = !!state.link?.isOpen && !!isFresh
    const R = Math.max(120, W - CRAB_W - 14)
    const toggle = open => {
      const isClosing = p.open === open
      set(isClosing ? { open: '', detail: '', task: '' } : { open, detail: '', task: '' })
      if (!isClosing && open === 'chat') act('exact', true)
    }
    const limitLine = limit => (!limit ? 'no reading yet' : limit.isLive ? resetWords(limit.resetsAt, at) : `saved ${agoWords(at - limit.readAt)}`)
    const chatSegments = s.breakdown ? s.breakdown.categories.filter(x => x.kind === 'used').sort(categoryOrder).map(x => ({ color: categoryColor(x.name), share: s.chatWindow ? (x.tokens / s.chatWindow) * 100 : 0 })) : [{ color: '#D97757', share: s.chatPercent }]
    const lookName = COSTUMES.find(x => x.value === look)?.label ?? 'Owl'
    const bar = (id, title, note, value, segments) => press(`b-${id}`, heroBarSvg(R, { id, title, note, value, isOpen: p.open === id, segments }), `${title} ${value}`, () => toggle(id))

    const parts = [
      `<div class="hero"><div style="flex:none;width:${CRAB_W}px">${press('me', heroCrabSvg(look, isWorking), `Your agent, ${lookName}. Press to change the icon.`, () => { p.showLooks = !p.showLooks; draw() })}</div><div class="right">`,
      press('hero-name', heroHeadSvg(R, name, s.model ? modelName(s.model) : 'Claude', isWorking), `${name}, ${isWorking ? 'working' : 'idle'}. Press to rename.`, () => { p.isRenaming = true; rename(name) }),
      bar('chat', 'Current task', `${fmtTokens(s.chatTokens)}/${fmtTokens(s.chatWindow)}`, `${Math.round(s.chatPercent)}%`, chatSegments),
      bar('five', '5 hours', limitLine(s.five), s.five ? `${s.five.percent}%` : '–', [{ color: FIVE_COLOR, share: s.five?.percent ?? 0 }]),
      bar('week', 'Weekly', limitLine(s.week), s.week ? `${s.week.percent}%` : '–', [{ color: WEEK_COLOR, share: s.week?.percent ?? 0 }]),
      '</div></div>',
      `<div class="section">${tilesSvg(W, [{ k: 'Est. cost', v: `≈${fmtCost(sc ? sc.cost + sc.subagentCost : s.cost)}` }, { k: 'Tokens used', v: fmtTokens(whole) }, { k: isStale ? 'Task length' : 'Task age', v: s.startedAt ? clockTime(Math.max(0, (isStale ? task.updatedAt : at) - s.startedAt)) : '–' }])}</div>`,
    ]
    if (!task && data.wanted) parts.push(section(para('This task has not sent its figures yet. They arrive after its next reply.')))
    if (isStale) parts.push(section(para(`No task is reporting right now. These figures are from a task last active ${agoWords(at - task.updatedAt)}.`)))

    if (p.showLooks) {
      parts.push(section(para(`Agent icon · ${lookName}`, 'dim'), stack(...COSTUMES.map(x => press(`look-${x.value}`, lookSvg(W, x.value, x.label, x.value === look), x.label, () => {
        data.prefs = { ...prefs, costume: x.value }
        T.savePrefs({ costume: x.value })
        p.showLooks = false
        draw()
      })))))
    }

    if (isBigChat(s) && s.chatTokens > 0 && p.detail === '' && p.open !== 'chat') {
      parts.push(section(para(`This task is big: every reply re-reads about ${fmtTokens(s.chatTokens)} tokens.`, 'dim'), button('big', 'See how to reduce it ›', () => { set({ open: 'chat', detail: 'Messages', task: '' }); act('exact', true) }, 'plain')))
    }

    if (p.open === 'chat') parts.push(chatSection(s, W))
    if (p.open === 'five') parts.push(windowSection('5-hour', s.five, FIVE_H, FIVE_COLOR, at, W))
    if (p.open === 'week') parts.push(windowSection('weekly', s.week, WEEK, WEEK_COLOR, at, W))

    const notice = state.notice?.text && at - state.notice.at < 120000 ? state.notice.text : p.sent
    if (notice) parts.push(section(para(notice, 'dim')))

    parts.push(agentList('Running', list.filter(a => a.status === 'running').reverse(), s, at, W))
    parts.push(agentList('Finished', list.filter(a => a.status !== 'running').slice(-5).reverse(), s, at, W))

    const cacheLeft = c.lastEnd ? c.lastEnd + c.ttlMs - at : 0
    const cachePct = c.ttlMs ? Math.max(0, Math.min(100, (cacheLeft / c.ttlMs) * 100)) : 0
    const cacheColor = cachePct > 40 ? GOOD : cachePct > 15 ? '#D9A441' : BAD
    parts.push(section(
      para('Cache', 'dim'),
      usageSvg(W, { id: 'cache', title: !c.lastEnd ? 'Waiting for a reply' : cacheLeft > 0 ? 'Warm' : 'Cold', value: cacheLeft > 0 ? mmss(cacheLeft) : '0:00', meta: c.isKnown ? `${c.ttlMs === ONE_H ? '1 hour' : '5 minute'} cache` : 'cache length not known yet', right: cacheLeft > 0 ? '' : 'next reply re-writes it', isOpen: false, segments: [{ color: cacheColor, share: cachePct }] }).replace('>▸<', '><'),
      canAct ? button('warm', w.isOn ? (w.isSending ? 'Pinging…' : 'Stop keep warm') : 'Keep warm', () => act('warm'), 'plain') : para(isStale ? '' : 'Keep warm and Compact appear once this task is sending live updates.', 'dim'),
      w.isOn ? para(`${plural(w.pings, 'ping')} sent. Each one uses a little of your limit.`, 'dim') : w.note ? para(w.note, 'dim') : '',
    ))

    parts.push(activity(l, s, at, W))
    if (!task) parts.push(section(para('No Cowork task has reported yet. Send a message in a task.', 'dim')))
    return { html: parts.join(''), liveWords: !task ? 'Waiting for a task' : isFresh ? 'Live' : `Last update ${agoWords(at - task.updatedAt)}` }
  }

  function rename(current) {
    root.insertAdjacentHTML('afterbegin', `<form class="inline" id="rename" style="margin-bottom:10px"><input aria-label="Agent name" placeholder="${xml(DEFAULT_NAME)}" value="${current === DEFAULT_NAME ? '' : xml(current)}"><button class="primary">Save</button><button type="button" class="plain" id="cancel">Cancel</button></form>`)
    const form = document.getElementById('rename')
    const input = form.querySelector('input')
    input.focus()
    const close = () => { p.isRenaming = false; lastHtml = ''; draw() }
    document.getElementById('cancel').addEventListener('click', close)
    form.addEventListener('submit', event => {
      event.preventDefault()
      const clean = cleanName(input.value)
      data.prefs = { ...data.prefs, name: clean }
      T.savePrefs({ name: clean })
      close()
    })
  }

  function draw() {
    if (p.isRenaming) return
    if (!data) {
      document.getElementById('live').textContent = problem ? 'Not connected' : 'Connecting'
      root.innerHTML = problem ? `<p class="dim">${xml(problem)}</p>` : ''
      return
    }
    const { html, liveWords } = view()
    if (data.version) document.getElementById('version').textContent = `Usage Desk Cowork ${data.version}`
    document.getElementById('live').textContent = isConnected ? liveWords : problem || T.lostWords
    if (html === lastHtml) return
    const focused = document.activeElement?.dataset?.k
    root.innerHTML = html
    lastHtml = html
    if (focused) root.querySelector(`[data-k="${CSS.escape(focused)}"]`)?.focus()
  }

  // Handlers are numbered per drawing, so a press always runs what is on screen.
  const run = target => {
    const el = target.closest('[data-p]')
    if (el) handlers[Number(el.dataset.p)]?.()
  }
  root.addEventListener('click', event => { if (!event.target.closest('#rename')) run(event.target) })
  root.addEventListener('keydown', event => {
    if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.press')) {
      event.preventDefault()
      run(event.target)
    }
  })
  window.addEventListener('resize', draw)

  async function poll() {
    let wait = T.everyMs
    if (!document.hidden || !data) {
      try {
        data = await T.read()
        isConnected = true
        problem = ''
      } catch (error) {
        isConnected = false
        problem = T.explain ? T.explain(error) : ''
        if (T.retryMs) wait = T.retryMs(error)
      }
      draw()
    }
    setTimeout(poll, wait)
  }
  poll()
  // Countdowns and ages move every second, whatever the reading pace.
  setInterval(draw, 1000)
})()

</script>
